name: Phoenix资源筛选专项验证

on:
  workflow_dispatch:
    inputs:
      run_app_regression:
        description: 同时运行应用层回归测试
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: phoenix-resource-filter-check
  cancel-in-progress: false

jobs:
  phoenix-check:
    name: Phoenix资源解析与筛选回归
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 配置Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 检查Phoenix模块与测试文件
        shell: bash
        run: |
          set -euo pipefail
          test -s kotlin-tv/playback-phoenix/src/main/kotlin/com/hongguotv/core/PhoenixMediaResolver.kt
          test -s kotlin-tv/playback-phoenix/src/main/kotlin/com/hongguotv/core/PhoenixPlaybackSource.kt
          test -s kotlin-tv/playback-phoenix/src/test/kotlin/com/hongguotv/core/PhoenixPlaybackSourceTest.kt
          echo "Phoenix解析器、播放源和单元测试文件均存在"

      - name: 运行Phoenix资源解析专项单元测试
        working-directory: kotlin-tv
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :playback-phoenix:test

      - name: 运行应用层回归测试
        if: ${{ inputs.run_app_regression }}
        working-directory: kotlin-tv
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:compileDebugKotlin

      - name: 输出本次日志对应的诊断基线
        if: always()
        shell: bash
        run: |
          {
            echo "## Phoenix资源筛选诊断基线"
            echo ""
            echo "- 日志版本：红果TV 1.1.38"
            echo "- Phoenix响应：HTTP 200，正文约 16 KB（第二份日志为 16,211 bytes）"
            echo "- 当前解析结果：5 项候选资源被判定为不兼容编码"
            echo "- 加密拒绝计数：0"
            echo "- 诊断重点：核实候选资源的 codec_type、definition/vheight、URL字段及逐项拒绝原因"
            echo ""
            echo "> 注意：现有日志没有输出5项资源的原始字段。本工作流执行代码编译和已有回归测试，不会伪造候选资源明细，也不会调用需要设备注册身份的线上Phoenix接口。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传Phoenix单元测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-resource-filter-test-reports
          path: kotlin-tv/playback-phoenix/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 14

      - name: 上传应用层测试报告
        if: always() && inputs.run_app_regression
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-app-regression-test-reports
          path: kotlin-tv/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
