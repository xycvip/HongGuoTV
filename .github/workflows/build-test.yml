name: HHTV 构建测试版

on:
  push:
    branches:
      - refactor
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - refactor
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hhtv-build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 核心测试与 Debug APK 构建
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK 命令行工具
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: 安装 Android 36 平台与构建工具
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: 检查 Gradle Wrapper
        working-directory: kotlin-tv
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: 运行核心与应用单元测试
        run: ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 构建 Debug 测试 APK
        run: ./kotlin-tv/gradlew -p kotlin-tv :app:assembleDebug --no-daemon

      - name: 检查 APK 包名
        shell: bash
        run: |
          set -euo pipefail
          APK="kotlin-tv/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE="$(printf '%s\\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          test "$PACKAGE" = "com.x.hongguotv"
          echo "APK 编译及包名检查通过：$PACKAGE"
          ls -lh "$APK"

      - name: 上传测试 APK 和测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HHTV-debug-${{ github.run_number }}
          path: |
            kotlin-tv/app/build/outputs/apk/debug/*.apk
            kotlin-tv/core/build/test-results/test/**/*.xml
          if-no-files-found: warn
          retention-days: 14
