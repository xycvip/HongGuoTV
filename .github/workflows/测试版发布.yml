# 测试版发布：仅手动触发，发布到本源码仓库 Releases
name: 红果TV测试版发布

on:
  workflow_dispatch:
    inputs:
      confirm_beta_release:
        description: 确认构建并发布测试版到 HongGuoTV 仓库
        required: true
        type: boolean
        default: true
      skip_file_check:
        description: 跳过APK文件存在性检查（包名、版本号和签名校验始终执行）
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: hongguotv-bate-test-release
  cancel-in-progress: false

jobs:
  release:
    name: 构建、签名并发布测试版
    if: ${{ inputs.confirm_beta_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出红果TV源码
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 配置Java环境
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 检查签名凭据
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE_B64" ] || missing+=("HONGGUOTV_KEYSTORE_B64")
          [ -n "$STORE_PASSWORD" ] || missing+=("HONGGUOTV_STORE_PASSWORD")
          [ -n "$KEY_ALIAS" ] || missing+=("HONGGUOTV_KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || missing+=("HONGGUOTV_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::缺少签名凭据：%s\n' "$(IFS='、'; echo "${missing[*]}")"
            exit 1
          fi
          echo "签名凭据检查通过"

      - name: 准备产品签名文件
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/hongguotv-test-release.p12"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "HONGGUOTV_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "产品签名文件准备完成"

      - name: 读取测试版独立版本号
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_FILE="kotlin-tv/test-version.properties"
          test -s "$VERSION_FILE"
          VERSION_NAME="$(sed -n 's/^TEST_VERSION_NAME=//p' "$VERSION_FILE" | tail -n 1)"
          VERSION_CODE="$(sed -n 's/^TEST_VERSION_CODE=//p' "$VERSION_FILE" | tail -n 1)"
          [[ "$VERSION_NAME" =~ ^0\.0\.[0-9]+$ ]] || { echo "::error::测试版版本号格式错误：$VERSION_NAME"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "::error::测试版 versionCode 格式错误：$VERSION_CODE"; exit 1; }
          # 如果上一次已创建Release、但版本记录提交失败，则自动跳过已占用版本，避免卡死
          while true; do
            TAG="hongguotv-bate-v$VERSION_NAME"
            if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              break
            fi
            echo "发现已发布版本 $TAG，自动递增后继续"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
            VERSION_NAME="$MAJOR.$MINOR.$((PATCH + 1))"
            VERSION_CODE="$((VERSION_CODE + 1))"
          done
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "本次测试版版本：$VERSION_NAME"
          echo "本次 versionCode：$VERSION_CODE"

      - name: 构建测试版APK
        working-directory: kotlin-tv
        shell: bash
        env:
          HONGGUOTV_APPLICATION_ID: com.x.hongguotv.bate
          HONGGUOTV_APP_LABEL: 红果测试版
          HONGGUOTV_STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          HONGGUOTV_KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          HONGGUOTV_KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
          HONGGUOTV_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          HONGGUOTV_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          # Gradle构建结束后立即校验签名，早于复制、文件检查及包名版本检查。
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "APK签名校验通过"
          mkdir -p "$RUNNER_TEMP/test-release"
          cp "$APK" "$RUNNER_TEMP/test-release/HongguoTV-${HONGGUOTV_VERSION_NAME}.apk"
          echo "测试版APK构建完成"

      - name: 检查测试版APK并计算发布信息
        id: apk
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          SKIP_FILE_CHECK: ${{ inputs.skip_file_check }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/test-release/HongguoTV-$VERSION_NAME.apk"
          if [ "$SKIP_FILE_CHECK" = "true" ]; then
            echo "::warning::已按手动选择跳过APK文件存在性检查"
          else
            test -s "$APK"
            echo "APK文件检查通过"
          fi
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.x.hongguotv.bate' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"
          echo "包名、版本号和签名校验通过"
          SIZE="$(stat -c '%s' "$APK")"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "APK大小：$SIZE 字节"
          echo "APK SHA-256：$SHA256"

      - name: 发布到HongGuoTV仓库
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NOTES: |
            【无缝连播与双播放器】
            - 完善双播放器无缝接续，提前准备下一集，减少切集等待和画面中断。
            - 优化备用播放器首帧检测与接管流程，减少切换时黑屏和重复初始化。
            - 优化双播放器准备及交接期间的缓冲提示，增加超时保护，避免长期隐藏真实缓冲状态。
            - 完善备用播放器失败、内存紧张及后台切换时的资源释放和单播放器回退。
            - 优化电视端自动渲染策略：开启无缝连播时自动采用更适合双播放器接管的画面渲染方式；手动设置仍优先。

            【播放器状态诊断】
            - 调试模式新增播放器A、播放器B实时状态展示。
            - 显示当前播放状态、进度、缓冲位置，以及下一集备用资源准备、缓冲、READY和首帧状态。
            - 增加播放器交接状态信息，便于排查切集和画面显示问题。

            【第三方片源与备份恢复】
            - 第三方片源、观看历史和收藏纳入整机备份与恢复。
            - 整机恢复按备份内容完整覆盖第三方数据，备份中为空的数据也会清除对应记录。
            - 扫码导入片源改为只追加新片源，不覆盖已有片源。

            【播放与界面体验】
            - 播放控制栏显示视频实际分辨率，并在画面尺寸变化时自动更新。
            - 优化电视端主题磨砂玻璃导航栏、接口状态详情弹窗及遥控器焦点操作。
            - 完善设置项说明和调试入口。

            【远程管理与系统维护】
            - 增加远程文件管理删除功能。
            - 完善封面缓存清理、软件重置及资源释放流程。
          APK_SIZE: ${{ steps.apk.outputs.size }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/test-release/HongguoTV-$VERSION_NAME.apk"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          DOWNLOAD_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/HongguoTV-$VERSION_NAME.apk"
          mkdir -p test-update
          jq -n \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg versionName "$VERSION_NAME" \
            --arg tag "$RELEASE_TAG" \
            --arg apkName "HongguoTV-$VERSION_NAME.apk" \
            --arg sha256 "$APK_SHA256" \
            --arg url "$DOWNLOAD_URL" \
            --arg notes "$RELEASE_NOTES" \
            --argjson versionCode "$VERSION_CODE" \
            --argjson size "$APK_SIZE" \
            '{
              schema: 1,
              packageName: "com.x.hongguotv.bate",
              sourceCommit: $sourceCommit,
              versionCode: $versionCode,
              versionName: $versionName,
              minSdk: 26,
              tag: $tag,
              apk: {
                name: $apkName,
                size: $size,
                sha256: $sha256,
                url: $url
              },
              notes: $notes
            }' > test-update/latest.json
          cp test-update/latest.json "$RUNNER_TEMP/test-release/update.json"
          printf '%s  %s\n' "$APK_SHA256" "HongguoTV-$VERSION_NAME.apk" > "$RUNNER_TEMP/test-release/SHA256SUMS"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          # 红果TV测试版 $VERSION_NAME

          - 应用包名：com.x.hongguotv.bate
          - versionCode：$VERSION_CODE
          - APK大小：$APK_SIZE 字节
          - SHA-256：$APK_SHA256

          ## 更新说明
          $RELEASE_NOTES

          > 此版本为独立测试包，使用产品签名；不会上传或修改 AppDownload。
          EOF
          gh release create "$RELEASE_TAG" "$APK" "$RUNNER_TEMP/test-release/SHA256SUMS" "$RUNNER_TEMP/test-release/update.json" \
            --repo "$GITHUB_REPOSITORY" \
            --title "红果TV测试版 $VERSION_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          echo "测试版已发布到本源码仓库 Releases"

      - name: 更新下一次测试版版本号
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          NEXT_NAME="$MAJOR.$MINOR.$((PATCH + 1))"
          NEXT_CODE="$((VERSION_CODE + 1))"
          cat > kotlin-tv/test-version.properties <<EOF
          TEST_VERSION_NAME=$NEXT_NAME
          TEST_VERSION_CODE=$NEXT_CODE
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kotlin-tv/test-version.properties test-update/latest.json
          git commit -m "发布测试版更新清单并递增版本号至 $NEXT_NAME"

          # 发布期间 main 可能有文档或代码新提交。先同步远端再重放版本更新提交，
          # 避免 APK 已发布后仅因非快进推送而把整个工作流标记为失败。
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::warning::测试版 APK 已发布，但版本记录与远端 main 发生冲突；本次跳过版本记录推送。下次发布会根据已占用的 Release 标签自动递增版本号。"
            exit 0
          fi

          if ! git push origin HEAD:main; then
            git fetch origin main
            if ! git rebase origin/main || ! git push origin HEAD:main; then
              git rebase --abort || true
              echo "::warning::测试版 APK 已发布，但版本记录推送遇到并发更新；下次发布会根据已占用的 Release 标签自动递增版本号。"
              exit 0
            fi
          fi
          echo "下一次测试版版本号已更新为：$NEXT_NAME"
          echo "下一次 versionCode 已更新为：$NEXT_CODE"

      - name: 输出发布结果
        if: success()
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "测试版发布成功"
          echo "应用包名：com.x.hongguotv.bate"
          echo "版本号：$VERSION_NAME"
          echo "versionCode：$VERSION_CODE"
          echo "发布标签：$RELEASE_TAG"
          echo "发布位置：当前 HongGuoTV 仓库 Releases"
