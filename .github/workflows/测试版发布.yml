# 测试版发布：仅手动触发，不上传正式分发仓库
name: 红果TV测试版发布

on:
  workflow_dispatch:
    inputs:
      test_notes:
        description: 本次测试内容或重点验证项目（可填写多行）
        required: false
        type: string
        default: "测试版构建，请重点检查安装覆盖、播放和主要功能。"
      confirm_build:
        description: 确认使用正式签名生成可覆盖正式版的测试包
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hongguotv-test-release
  cancel-in-progress: false

jobs:
  build:
    name: 构建并签名测试版
    if: ${{ inputs.confirm_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出红果TV源码
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 配置Java环境
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 检查正式签名凭据
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE_B64" ] || missing+=("HONGGUOTV_KEYSTORE_B64")
          [ -n "$STORE_PASSWORD" ] || missing+=("HONGGUOTV_STORE_PASSWORD")
          [ -n "$KEY_ALIAS" ] || missing+=("HONGGUOTV_KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || missing+=("HONGGUOTV_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::缺少正式签名凭据：%s\n' "$(IFS='、'; echo "${missing[*]}")"
            exit 1
          fi
          echo "正式签名凭据检查通过"

      - name: 准备正式签名文件
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/hongguotv-release.p12"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "HONGGUOTV_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "正式签名文件已准备"

      - name: 读取AppDownload正式版本并生成测试版本号
        id: version
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          LATEST_URL="https://raw.githubusercontent.com/xycvip/AppDownload/main/hongguoTV/latest.json"
          curl --fail --silent --show-error --location "$LATEST_URL" -o "$RUNNER_TEMP/latest.json"
          jq -e '
            .packageName == "com.x.hongguotv"
            and (.versionName | type == "string")
            and (.versionCode | type == "number")
          ' "$RUNNER_TEMP/latest.json" >/dev/null

          OLD_NAME="$(jq -r '.versionName' "$RUNNER_TEMP/latest.json")"
          OLD_CODE="$(jq -r '.versionCode' "$RUNNER_TEMP/latest.json")"
          if [[ ! "$OLD_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::AppDownload中的正式版本号格式不正确：$OLD_NAME"
            exit 1
          fi

          NEXT_NAME="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          TEST_NAME="${NEXT_NAME}-test.${RUN_NUMBER}"
          TEST_CODE="$((OLD_CODE + 1))"

          echo "version_name=$TEST_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$TEST_CODE" >> "$GITHUB_OUTPUT"
          echo "上一个正式版：$OLD_NAME（versionCode：$OLD_CODE）"
          echo "本次测试版：$TEST_NAME（versionCode：$TEST_CODE）"
          echo "测试包使用下一正式版本的 versionCode，确保能够覆盖安装当前正式版"
          echo "测试包不修改 AppDownload 正式版清单；正式发布仍按正式清单递增"

      - name: 构建正式签名测试APK
        working-directory: kotlin-tv
        shell: bash
        env:
          HONGGUOTV_STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          HONGGUOTV_KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          HONGGUOTV_KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
          HONGGUOTV_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          HONGGUOTV_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p "$RUNNER_TEMP/test-release"
          cp "$APK" "$RUNNER_TEMP/test-release/HongguoTV-测试版-${HONGGUOTV_VERSION_NAME}.apk"
          echo "测试版APK构建完成"

      - name: 校验包名、版本号和签名
        id: verify
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/test-release/HongguoTV-测试版-$VERSION_NAME.apk"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -name apkanalyzer -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$APKANALYZER"

          "$APKSIGNER" verify --verbose --print-certs "$APK"
          PACKAGE_NAME="$("$APKANALYZER" manifest application-id "$APK")"
          ACTUAL_VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          ACTUAL_VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK")"

          [ "$PACKAGE_NAME" = "com.x.hongguotv" ] || {
            echo "::error::包名不正确：$PACKAGE_NAME"
            exit 1
          }
          [ "$ACTUAL_VERSION_CODE" = "$VERSION_CODE" ] || {
            echo "::error::versionCode不匹配：$ACTUAL_VERSION_CODE"
            exit 1
          }
          [ "$ACTUAL_VERSION_NAME" = "$VERSION_NAME" ] || {
            echo "::error::versionName不匹配：$ACTUAL_VERSION_NAME"
            exit 1
          }

          SIZE="$(stat -c '%s' "$APK")"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "package=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "包名、版本号和APK签名校验通过"
          echo "包名：$PACKAGE_NAME"
          echo "版本名称：$ACTUAL_VERSION_NAME"
          echo "versionCode：$ACTUAL_VERSION_CODE"
          echo "APK大小：$SIZE 字节"
          echo "SHA-256：$SHA256"

      - name: 上传测试版安装包
        uses: actions/upload-artifact@v4
        with:
          name: 红果TV测试版-${{ steps.version.outputs.version_name }}
          path: ${{ runner.temp }}/test-release/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: 输出测试版信息
        if: success()
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          PACKAGE_NAME: ${{ steps.verify.outputs.package }}
          APK_SIZE: ${{ steps.verify.outputs.size }}
          APK_SHA256: ${{ steps.verify.outputs.sha256 }}
          TEST_NOTES: ${{ inputs.test_notes }}
        run: |
          {
            echo "## 红果TV测试版构建成功"
            echo ""
            echo "- 包名：$PACKAGE_NAME"
            echo "- 版本名称：$VERSION_NAME"
            echo "- versionCode：$VERSION_CODE"
            echo "- APK大小：$APK_SIZE 字节"
            echo "- SHA-256：$APK_SHA256"
            echo ""
            echo "### 本次测试说明"
            printf "%s\\n" "$TEST_NOTES"
            echo ""
            echo "请在本次工作流运行页面的“构建产物”区域下载测试APK。"
            echo "本测试版不会发布到 AppDownload，也不会改变正式版更新清单。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "红果TV测试版构建成功"
          echo "包名：$PACKAGE_NAME"
          echo "版本名称：$VERSION_NAME"
          echo "versionCode：$VERSION_CODE"
          echo "APK大小：$APK_SIZE 字节"
          echo "SHA-256：$APK_SHA256"
          echo "请在本次工作流运行页面的“构建产物”区域下载测试APK"
          echo "本测试版没有发布到AppDownload，不会改变正式版更新清单"
