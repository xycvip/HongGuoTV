name: 临时迁移 HHTV refactor 到 HongGuoTV main
# 触发一次性迁移

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/migrate-from-hhtv.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出目标仓库
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 获取 HHTV refactor 固定版本
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/xycvip/HHTV.git /tmp/HHTV
          cd /tmp/HHTV
          git checkout 96a43e76c6fc7545be162317bc3a214832d022ed
          test "$(git rev-parse HEAD)" = "96a43e76c6fc7545be162317bc3a214832d022ed"

      - name: 按原目录迁移工程文件并排除说明文档
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='docs/' \
            --exclude='README*' \
            --exclude='*.md' \
            --exclude='.github/workflows/migrate-from-hhtv.yml' \
            /tmp/HHTV/ ./
          test -f kotlin-tv/settings.gradle.kts
          test -f kotlin-tv/app/build.gradle.kts
          test -f kotlin-tv/gradlew
          if find . -type f \( -iname '*.md' -o -iname 'README*' \) | grep -q .; then
            echo '发现未排除的说明文档'
            exit 1
          fi

      - name: 提交迁移结果到 main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: migrate HHTV refactor source into HongGuoTV main"
          git push origin HEAD:main
