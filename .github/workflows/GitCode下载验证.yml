name: GitCode 下载验证

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitcode-download-verification
  cancel-in-progress: true

jobs:
  verify:
    name: 验证 GitCode 清单与 APK 下载
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 获取 GitCode 最新正式版 Release 信息
        id: release
        shell: bash
        run: |
          set -euo pipefail
          API_URL="https://api.gitcode.com/api/v5/repos/xycvip/hongguotv/releases/latest?type=latest"
          echo "请求：$API_URL"
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 \
            --connect-timeout 15 --max-time 60 \
            -H "Accept: application/json" \
            "$API_URL" -o "$RUNNER_TEMP/gitcode-release.json"

          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          data = json.loads(Path(os.environ["RUNNER_TEMP"] + "/gitcode-release.json").read_text())
          tag = data.get("tag_name", "")
          if data.get("prerelease", False):
              raise SystemExit("失败：API 返回的是预发布版本")
          if data.get("release_status") != "latest":
              raise SystemExit("失败：release_status 不是 latest")
          if not re.fullmatch(r"hongguotv-v[0-9][0-9A-Za-z.+-]{0,80}", tag):
              raise SystemExit(f"失败：正式版标签格式不正确：{tag!r}")

          assets = data.get("assets") or []
          manifest = next((a for a in assets if a.get("type") == "attach" and a.get("name") == "update.json"), None)
          if not manifest:
              raise SystemExit("失败：Release API 中没有 update.json 附件")
          expected = f"https://gitcode.com/xycvip/hongguotv/releases/download/{tag}/update.json"
          if manifest.get("browser_download_url") != expected:
              raise SystemExit("失败：update.json 附件地址与 GitCode 正式下载格式不一致："
                               + str(manifest.get("browser_download_url")))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"tag={tag}\n")
              f.write(f"manifest_url={manifest['browser_download_url']}\n")
          print(f"Release 标签：{tag}")
          print(f"清单附件：{manifest['browser_download_url']}")
          PY

      - name: 下载并校验 update.json
        id: manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          URL="${{ steps.release.outputs.manifest_url }}"
          echo "下载更新清单：$URL"
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 \
            --connect-timeout 15 --max-time 60 \
            "$URL" -o "$RUNNER_TEMP/gitcode-update.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          p = Path(os.environ["RUNNER_TEMP"] + "/gitcode-update.json")
          data = json.loads(p.read_text())
          if data.get("schema") != 1:
              raise SystemExit("失败：update.json schema 不等于 1")
          if data.get("packageName") != "com.x.hongguotv":
              raise SystemExit("失败：包名不是正式版 com.x.hongguotv")
          if data.get("tag") != os.environ["RELEASE_TAG"]:
              raise SystemExit("失败：清单 tag 与 Release API 返回的 tag 不一致")
          apk = data.get("apk") or {}
          name = apk.get("name", "")
          if not re.fullmatch(r"HongguoTV-[0-9][0-9A-Za-z.+-]{0,80}\.apk", name):
              raise SystemExit(f"失败：APK 文件名格式不正确：{name!r}")
          url = apk.get("url", "")
          expected = f"https://gitcode.com/xycvip/hongguotv/releases/download/{data['tag']}/{name}"
          if url != expected:
              raise SystemExit(f"失败：清单内 APK 地址不符合新下载格式：{url!r}")
          size = apk.get("size")
          sha = apk.get("sha256", "").lower()
          if not isinstance(size, int) or size <= 0:
              raise SystemExit("失败：APK size 无效")
          if not re.fullmatch(r"[0-9a-f]{64}", sha):
              raise SystemExit("失败：APK SHA256 格式无效")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"apk_url={url}\n")
              f.write(f"apk_name={name}\n")
              f.write(f"apk_size={size}\n")
              f.write(f"apk_sha256={sha}\n")
          print("update.json 校验通过")
          print(f"APK 文件：{name}")
          print(f"APK 地址：{url}")
          print(f"清单声明大小：{size} 字节")
          print(f"清单 SHA256：{sha}")
          PY

      - name: 按新地址下载 APK
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.manifest.outputs.apk_url }}"
          FILE="$RUNNER_TEMP/${{ steps.manifest.outputs.apk_name }}"
          echo "开始下载：$URL"
          curl --fail --show-error --location --retry 3 --retry-delay 3 \
            --connect-timeout 20 --max-time 600 \
            --progress-bar "$URL" -o "$FILE"
          echo "下载完成：$(stat -c '%s' "$FILE") 字节"
          echo "文件类型：$(file -b "$FILE")"
          echo "apk_path=$FILE" >> "$GITHUB_ENV"

      - name: 校验 APK 大小、SHA256 和 APK 结构
        shell: bash
        run: |
          set -euo pipefail
          FILE="$apk_path"
          ACTUAL_SIZE="$(stat -c '%s' "$FILE")"
          EXPECTED_SIZE="${{ steps.manifest.outputs.apk_size }}"
          ACTUAL_SHA="$(sha256sum "$FILE" | awk '{print $1}')"
          EXPECTED_SHA="${{ steps.manifest.outputs.apk_sha256 }}"

          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ]; then
            echo "::error::APK 大小不一致：期望 $EXPECTED_SIZE，实际 $ACTUAL_SIZE"
            exit 1
          fi
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::APK SHA256 不一致：期望 $EXPECTED_SHA，实际 $ACTUAL_SHA"
            exit 1
          fi
          unzip -t "$FILE" >/dev/null
          unzip -l "$FILE" | grep -q 'AndroidManifest.xml'
          echo "APK 下载与完整性校验全部通过。"
          {
            echo "## GitCode APK 下载验证通过"
            echo ""
            echo "- Release：` ${{ steps.release.outputs.tag }} `"
            echo "- 文件：` ${{ steps.manifest.outputs.apk_name }} `"
            echo "- 下载地址：` ${{ steps.manifest.outputs.apk_url }} `"
            echo "- 文件大小：$ACTUAL_SIZE 字节"
            echo "- SHA256：`$ACTUAL_SHA`"
            echo "- ZIP/APK 结构：通过"
          } >> "$GITHUB_STEP_SUMMARY"
