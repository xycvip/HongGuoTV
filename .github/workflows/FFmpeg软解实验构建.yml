name: FFmpeg软解实验构建

on:
  push:
    branches:
      - feature/ffmpeg-soft-decode
    paths:
      - "kotlin-tv/app/**"
      - "kotlin-tv/core/**"
      - "kotlin-tv/gradle/**"
      - "kotlin-tv/gradlew"
      - "kotlin-tv/gradle.properties"
      - "kotlin-tv/settings.gradle.kts"
      - "kotlin-tv/build.gradle.kts"
      - ".github/workflows/FFmpeg软解实验构建.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffmpeg-soft-decode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: 编译 FFmpeg 软解实验分支
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 配置 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: kotlin-tv/**/*.gradle*

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 编译实验版 APK
        working-directory: kotlin-tv
        run: |
          ./gradlew --no-daemon :app:compileDebugKotlin
          ./gradlew --no-daemon :app:assembleDebug

      - name: 上传实验 APK
        uses: actions/upload-artifact@v6
        with:
          name: HongGuoTV-FFmpeg-SoftDecode-Debug
          path: kotlin-tv/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
