name: 清理历史工作流

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 输入 DELETE 确认清理
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    name: 清理非发布工作流历史记录
    runs-on: ubuntu-latest
    steps:
      - name: 批量清理历史记录
        uses: actions/github-script@v7
        env:
          CLEANUP_CONFIRM: ${{ inputs.confirm }}
        with:
          script: |
            if (process.env.CLEANUP_CONFIRM !== 'DELETE') {
              core.setFailed('确认内容不正确。请输入 DELETE 后重新运行。');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keepNames = new Set([
              '正式版发布.yml',
              '测试版发布.yml'
            ]);
            const currentRunId = context.runId;
            const branch = context.ref.replace('refs/heads/', '');

            core.info('正在分页获取全部历史工作流运行记录……');
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );

            const targets = runs.filter(run => {
              const fileName = String(run.path || '').split('/').pop();
              return !keepNames.has(fileName) && run.id !== currentRunId;
            });

            core.info(`共扫描到 ${runs.length} 条记录。`);
            core.info(`正式版、测试版发布记录将保留；待删除 ${targets.length} 条。`);

            let deleted = 0;
            let failed = 0;
            for (const run of targets) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
                deleted++;
                core.info(`已删除：${run.name} | ${run.id}`);
              } catch (error) {
                failed++;
                core.warning(`删除失败：${run.name} | ${run.id} | ${error.message}`);
              }
            }

            core.info(`历史记录处理结束：成功删除 ${deleted} 条，失败 ${failed} 条。`);

            const workflowPath = '.github/workflows/清理历史工作流.yml';
            const file = await github.rest.repos.getContent({
              owner,
              repo,
              path: workflowPath,
              ref: branch
            });
            await github.rest.repos.deleteFile({
              owner,
              repo,
              path: workflowPath,
              message: '清理完成：移除一次性清理工作流',
              sha: file.data.sha,
              branch
            });
            core.info('一次性清理工作流文件已从仓库移除。');

            try {
              await github.rest.actions.deleteWorkflowRun({
                owner,
                repo,
                run_id: currentRunId
              });
              core.info('本次清理运行记录已删除。');
            } catch (error) {
              core.warning(`本次运行记录未能自删除：${error.message}`);
            }

            if (failed > 0) {
              core.setFailed(`有 ${failed} 条历史记录删除失败，请检查日志。`);
            }
