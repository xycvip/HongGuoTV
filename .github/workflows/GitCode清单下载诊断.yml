name: GitCode 清单与 APK 下载诊断

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: 原始地址清单与 APK 下载测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 下载原始 update.json（不添加任何参数）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-results
          MANIFEST_URL='https://gitcode.com/xycvip/hongguotv/releases/download/hongguotv-v1.1.33/update.json'
          for item in app android-chrome; do
            if [ "$item" = app ]; then
              UA='HongguoTV-Updater'
            else
              UA='Mozilla/5.0 (Linux; Android 16; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0.0.0 Mobile Safari/537.36'
            fi
            echo "========== 清单：$item =========="
            curl --silent --show-error --location --fail-with-body \
              --max-redirs 10 --connect-timeout 15 --max-time 60 \
              --user-agent "$UA" \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              --dump-header "probe-results/manifest-$item.headers" \
              --output "probe-results/manifest-$item.json" \
              --write-out $'HTTP=%{http_code}\nFINAL_URL=%{url_effective}\nREDIRECTS=%{num_redirects}\nBYTES=%{size_download}\n' \
              "$MANIFEST_URL"
            jq -e . "probe-results/manifest-$item.json" >/dev/null
            sha256sum "probe-results/manifest-$item.json"
          done

      - name: 从清单读取 APK 原始地址并下载验证（不添加任何参数）
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST='probe-results/manifest-app.json'
          APK_URL="$(jq -r '.apk.url' "$MANIFEST")"
          EXPECTED_SIZE="$(jq -r '.apk.size' "$MANIFEST")"
          EXPECTED_SHA="$(jq -r '.apk.sha256' "$MANIFEST")"
          echo "APK 原始地址：$APK_URL"
          echo "清单预期大小：$EXPECTED_SIZE"
          echo "清单预期 SHA-256：$EXPECTED_SHA"
          case "$APK_URL" in
            'https://gitcode.com/xycvip/hongguotv/releases/download/hongguotv-v1.1.33/'*) ;;
            *) echo "APK 地址不符合本次 v1.1.33 GitCode Release 预期"; exit 1 ;;
          esac

          for item in app android-chrome; do
            if [ "$item" = app ]; then
              UA='HongguoTV-Updater'
            else
              UA='Mozilla/5.0 (Linux; Android 16; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0.0.0 Mobile Safari/537.36'
            fi
            echo "========== APK：$item =========="
            curl --silent --show-error --location --fail-with-body \
              --max-redirs 10 --connect-timeout 15 --max-time 300 \
              --user-agent "$UA" \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              --dump-header "probe-results/apk-$item.headers" \
              --output "probe-results/apk-$item.apk" \
              --write-out $'HTTP=%{http_code}\nFINAL_URL=%{url_effective}\nREDIRECTS=%{num_redirects}\nBYTES=%{size_download}\n' \
              "$APK_URL"
            ACTUAL_SIZE="$(wc -c < "probe-results/apk-$item.apk" | tr -d ' ')"
            ACTUAL_SHA="$(sha256sum "probe-results/apk-$item.apk" | awk '{print $1}')"
            echo "实际大小：$ACTUAL_SIZE"
            echo "实际 SHA-256：$ACTUAL_SHA"
            test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
            test "$ACTUAL_SHA" = "$EXPECTED_SHA"
            echo "APK 校验：通过"
          done

      - name: 汇总响应头并上传诊断结果
        if: always()
        shell: bash
        run: |
          echo '========== HTTP 响应头摘要 =========='
          grep -hiE '^(HTTP/|location:|content-type:|content-length:|server:)' probe-results/*.headers || true
      - name: 上传诊断结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitcode-manifest-and-apk-probe
          path: probe-results/
          if-no-files-found: warn
          retention-days: 7
