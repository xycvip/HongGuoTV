name: 抖音分享链接真实浏览器识别测试

on:
  workflow_dispatch:
    inputs:
      share_input:
        description: 抖音短链接、视频长链接或视频 ID
        required: true
        type: string
        default: https://v.douyin.com/z_xefff5id4/
  push:
    paths:
      - .github/workflows/抖音iPad-UA测试.yml

permissions:
  contents: read

jobs:
  douyin-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: 使用真实 Chromium 解析抖音分享链接并监听详情接口
        env:
          SHARE_INPUT: ${{ inputs.share_input || 'https://v.douyin.com/z_xefff5id4/' }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright

          raw = os.environ["SHARE_INPUT"].strip()
          if re.fullmatch(r"\d{10,25}", raw):
              start_url = f"https://www.douyin.com/video/{raw}"
          else:
              start_url = raw if "://" in raw else "https://" + raw

          def is_douyin(url):
              p = urlparse(url)
              host = (p.hostname or "").lower()
              return p.scheme == "https" and (host == "douyin.com" or host.endswith(".douyin.com"))

          if not is_douyin(start_url):
              raise SystemExit("只允许输入抖音官方 HTTPS 链接或纯数字视频 ID")

          report = {
              "input": raw, "start_url": start_url, "resolved_url": "",
              "video_id": "", "page_title": "", "page_text": "",
              "dom_candidates": {}, "meta": {}, "network_detail_responses": [],
              "redirects": [], "observed_video_ids": [], "iesdouyin_page": {},
              "console_errors": [], "page_errors": [], "blocked_indicators": [],
              "error": ""
          }

          def scan_json(obj, found, path="$", depth=0):
              if depth > 12 or len(found) >= 30:
                  return
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if key in ("desc", "description", "title", "nickname") and isinstance(value, str) and value.strip():
                          found.append({"path": f"{path}.{key}", "value": value[:1000]})
                      if isinstance(value, (dict, list)):
                          scan_json(value, found, f"{path}.{key}", depth + 1)
              elif isinstance(obj, list):
                  for i, value in enumerate(obj[:100]):
                      if isinstance(value, (dict, list)):
                          scan_json(value, found, f"{path}[{i}]", depth + 1)

          def safe_url(url):
              try:
                  parsed = urlparse(url)
                  return parsed.scheme + "://" + parsed.netloc + parsed.path
              except Exception:
                  return url[:500]

          def add_video_id(url):
              if not url:
                  return
              match = re.search(r"/(?:share/video|video|note)/(\\d+)", url)
              if match and match.group(1) not in report["observed_video_ids"]:
                  report["observed_video_ids"].append(match.group(1))

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  locale="zh-CN", timezone_id="Asia/Shanghai",
                  viewport={"width": 1440, "height": 1000}
              )
              page = context.new_page()
              page.set_default_timeout(15000)
              page.on("console", lambda msg: report["console_errors"].append(msg.text[:500])
                      if msg.type == "error" and len(report["console_errors"]) < 30 else None)
              page.on("pageerror", lambda exc: report["page_errors"].append(str(exc)[:1000])
                      if len(report["page_errors"]) < 30 else None)

              page.on("request", lambda request: add_video_id(request.url))

              def on_response(response):
                  low = response.url.lower()
                  add_video_id(response.url)
                  location = response.headers.get("location", "")
                  if 300 <= response.status < 400:
                      add_video_id(location)
                      report["redirects"].append({
                          "url": safe_url(response.url),
                          "status": response.status,
                          "location": safe_url(location) if location else ""
                      })
                  if any(k in low for k in ("aweme", "video/detail", "iteminfo", "detail", "share/video")):
                      item = {
                          "url": safe_url(response.url), "status": response.status,
                          "content_type": response.headers.get("content-type", "")[:200]
                      }
                      try:
                          if "json" in item["content_type"].lower():
                              payload = response.json()
                              found = []
                              scan_json(payload, found)
                              item["json_top_keys"] = list(payload.keys())[:50] if isinstance(payload, dict) else []
                              item["json_fields_sample"] = found[:30]
                      except Exception as exc:
                          item["body_parse_error"] = str(exc)[:300]
                      report["network_detail_responses"].append(item)

              page.on("response", on_response)
              try:
                  response = page.goto(start_url, wait_until="domcontentloaded", timeout=60000)
                  report["initial_http_status"] = response.status if response else None
                  page.wait_for_timeout(12000)
                  resolved = page.url
                  if not is_douyin(resolved):
                      raise RuntimeError("短链接跳转到了非抖音官方域名，停止访问")
                  report["resolved_url"] = resolved
                  match = re.search(r"/(?:video|note)/(\d+)", resolved)
                  video_id = match.group(1) if match else ""
                  report["video_id"] = video_id

                  detail_url = f"https://www.douyin.com/video/{video_id}" if video_id else resolved
                  if detail_url != page.url:
                      response = page.goto(detail_url, wait_until="domcontentloaded", timeout=60000)
                      report["detail_http_status"] = response.status if response else None

                  page.wait_for_timeout(15000)
                  report["resolved_url"] = safe_url(page.url)
                  report["page_title"] = page.title()
                  body = page.locator("body").inner_text() if page.locator("body").count() else ""
                  report["page_text"] = re.sub(r"\s+", " ", body)[:5000]
                  report["dom_candidates"] = page.evaluate("""() => {
                    const selectors = ['h1','[data-e2e="video-desc"]',
                      '[data-e2e="video-author-nickname"]',
                      '[class*="video-info"] [class*="desc"]','[class*="desc"]'];
                    const out = {};
                    for (const selector of selectors) {
                      out[selector] = [...document.querySelectorAll(selector)].slice(0,8)
                        .map(e => (e.innerText || e.textContent || '').trim())
                        .filter(Boolean).map(s => s.slice(0,1000));
                    }
                    const meta = {};
                    for (const e of document.querySelectorAll('meta')) {
                      const k = e.getAttribute('property') || e.getAttribute('name') || e.getAttribute('itemprop');
                      if (k && e.content) meta[k] = e.content.slice(0,2000);
                    }
                    return {selectors:out,meta};
                  }""")
                  report["meta"] = report["dom_candidates"].pop("meta", {})
                  for marker in ("验证码", "访问过于频繁", "登录后", "安全验证", "网络异常"):
                      if marker in report["page_text"]:
                          report["blocked_indicators"].append("douyin:" + marker)
                  with open("douyin-rendered.html", "w", encoding="utf-8") as f:
                      f.write(page.content()[:10000000])
              except Exception as exc:
                  report["error"] = f"{type(exc).__name__}: {exc}"
                  try:
                      with open("douyin-rendered.html", "w", encoding="utf-8") as f:
                          f.write(page.content()[:10000000])
                  except Exception:
                      pass
              finally:
                  browser.close()

          print("========== 抖音真实浏览器识别结果 ==========")
          print(json.dumps(report, ensure_ascii=False, indent=2)[:30000])
          with open("douyin-browser-report.json", "w", encoding="utf-8") as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
          with open("douyin-browser-report.md", "w", encoding="utf-8") as f:
              f.write("# 抖音真实浏览器识别报告\n\n")
              f.write(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: 上传识别报告和渲染后网页
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-browser-identification-report
          path: |
            douyin-browser-report.json
            douyin-browser-report.md
            douyin-rendered.html
          if-no-files-found: ignore
          retention-days: 7
