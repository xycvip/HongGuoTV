name: 抖音分享链接真实浏览器识别测试

on:
  workflow_dispatch:
    inputs:
      share_input:
        description: 抖音短链接、视频长链接或视频 ID
        required: true
        type: string
        default: https://v.douyin.com/TWTYb0ANh3c/
  push:
    paths:
      - .github/workflows/抖音iPad-UA测试.yml

permissions:
  contents: read

jobs:
  douyin-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: 使用真实 Chromium 解析抖音分享链接并监听详情接口
        env:
          SHARE_INPUT: ${{ inputs.share_input || 'https://v.douyin.com/TWTYb0ANh3c/' }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright

          raw = os.environ["SHARE_INPUT"].strip()
          if re.fullmatch(r"\d{10,25}", raw):
              start_url = f"https://www.douyin.com/video/{raw}"
          else:
              start_url = raw if "://" in raw else "https://" + raw

          def is_douyin(url):
              p = urlparse(url)
              host = (p.hostname or "").lower()
              # 抖音分享短链会正常跳转到 iesdouyin.com，
              # 它与 douyin.com 是两个独立根域名，必须分别加入白名单。
              roots = ("douyin.com", "iesdouyin.com")
              return p.scheme == "https" and any(host == root or host.endswith("." + root) for root in roots)

          if not is_douyin(start_url):
              raise SystemExit("只允许输入抖音官方 HTTPS 链接或纯数字视频 ID")

          report = {
              "input": urlparse(raw if "://" in raw else "https://" + raw).scheme + "://" + urlparse(raw if "://" in raw else "https://" + raw).netloc + urlparse(raw if "://" in raw else "https://" + raw).path, "start_url": urlparse(start_url).scheme + "://" + urlparse(start_url).netloc + urlparse(start_url).path, "resolved_url": "",
              "video_id": "", "page_title": "", "page_text": "",
              "dom_candidates": {}, "meta": {}, "network_detail_responses": [],
              "redirects": [], "observed_video_ids": [], "iesdouyin_page": {},
              "console_errors": [], "page_errors": [], "blocked_indicators": [],
              "error": "", "detail": {}, "detail_attempts": [], "raw_api_samples": [],
              "network_detail_matches": [],
          "feed_api_attempts": [], "feed_api_result": {}
          }

          def scan_json(obj, found, path="$", depth=0):
              if depth > 12 or len(found) >= 30:
                  return
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if key in ("desc", "description", "title", "nickname") and isinstance(value, str) and value.strip():
                          found.append({"path": f"{path}.{key}", "value": value[:1000]})
                      if isinstance(value, (dict, list)):
                          scan_json(value, found, f"{path}.{key}", depth + 1)
              elif isinstance(obj, list):
                  for i, value in enumerate(obj[:100]):
                      if isinstance(value, (dict, list)):
                          scan_json(value, found, f"{path}[{i}]", depth + 1)

          def extract_router_data(html):
              marker = re.search(r"(?:window\.)?_ROUTER_DATA\s*=\s*", html)
              if not marker:
                  return None
              start = html.find("{", marker.end())
              if start < 0:
                  return None
              depth, in_string, escaped = 0, False, False
              for i in range(start, len(html)):
                  ch = html[i]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == '"':
                          in_string = False
                  else:
                      if ch == '"':
                          in_string = True
                      elif ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              try:
                                  return json.loads(html[start:i + 1])
                              except Exception:
                                  return None
              return None

          def find_video_item(obj, path="$", depth=0):
              if depth > 18:
                  return None
              if isinstance(obj, dict):
                  info = obj.get("videoInfoRes")
                  if isinstance(info, dict):
                      items = info.get("item_list") or []
                      if items and isinstance(items[0], dict):
                          return items[0], path + ".videoInfoRes.item_list[0]"
                  for key, value in obj.items():
                      if key in ("aweme_detail", "awemeDetail") and isinstance(value, dict) and value.get("aweme_id"):
                          return value, path + "." + key
                      if isinstance(value, (dict, list)):
                          found = find_video_item(value, path + "." + str(key), depth + 1)
                          if found:
                              return found
              elif isinstance(obj, list):
                  for i, value in enumerate(obj[:100]):
                      found = find_video_item(value, f"{path}[{i}]", depth + 1)
                      if found:
                          return found
              return None

          def normalize_item(item, source_path):
              video = item.get("video") or {}
              author = item.get("author") or {}
              stats = item.get("statistics") or {}
              cover = video.get("cover") or video.get("origin_cover") or {}
              play = video.get("play_addr") or {}
              return {
                  "source_path": source_path,
                  "aweme_id": str(item.get("aweme_id") or item.get("item_id") or ""),
                  "desc": item.get("desc") or "",
                  "author": author.get("nickname") or author.get("unique_id") or "",
                  "digg_count": stats.get("digg_count"),
                  "comment_count": stats.get("comment_count"),
                  "share_count": stats.get("share_count"),
                  "collect_count": stats.get("collect_count"),
                  "duration_ms": video.get("duration"),
                  "width": video.get("width"),
                  "height": video.get("height"),
                  "cover_urls": (cover.get("url_list") or [])[:5],
                  "play_urls": (play.get("url_list") or [])[:5],
                  "item_type": item.get("aweme_type")
              }

          def try_mobile_feed(video_id):
              """先走抖音 App Feed 接口；按 aweme_id 精确匹配，不能误拿推荐视频。"""
              import requests
              endpoints = (
                  "https://api5-normal-c-hl.amemv.com/aweme/v1/feed/",
                  "https://aweme.snssdk.com/aweme/v1/feed/",
              )
              params = {
                  "aweme_id": video_id,
                  "aid": "1128",
                  "device_platform": "android",
                  "app_name": "aweme",
                  "version_code": "350102",
                  "version_name": "35.1.2",
                  "channel": "googleplay",
                  "device_type": "Pixel 7",
                  "os_version": "13",
                  "language": "zh",
              }
              headers = {
                  "User-Agent": "com.ss.android.ugc.aweme/350102 (Linux; U; Android 13; zh_CN; Pixel 7; Build/TP1A.221005.002; Cronet/TTNetVersion:)",
                  "Accept": "application/json",
                  "Accept-Encoding": "gzip, deflate",
                  "Connection": "close",
              }
              for endpoint in endpoints:
                  attempt = {"url": endpoint, "status": None, "matched": False}
                  try:
                      response = requests.get(endpoint, params=params, headers=headers, timeout=20)
                      attempt["status"] = response.status_code
                      attempt["content_type"] = response.headers.get("content-type", "")[:160]
                      attempt["final_url"] = safe_url(response.url)
                      attempt["response_bytes"] = len(response.content)
                      if response.ok:
                          payload = response.json()
                          attempt["top_keys"] = list(payload.keys())[:40] if isinstance(payload, dict) else []
                          attempt["status_code"] = payload.get("status_code") if isinstance(payload, dict) else None
                          attempt["message"] = str((payload.get("message") or payload.get("msg") or ""))[:240] if isinstance(payload, dict) else ""
                          candidates = []
                          if isinstance(payload, dict):
                              for key in ("aweme_list", "items", "data"):
                                  value = payload.get(key)
                                  if isinstance(value, list):
                                      candidates.extend(x for x in value if isinstance(x, dict))
                                  elif isinstance(value, dict):
                                      nested = value.get("aweme_list") or value.get("items") or []
                                      candidates.extend(x for x in nested if isinstance(x, dict))
                              direct = payload.get("aweme_detail")
                              if isinstance(direct, dict):
                                  candidates.append(direct)
                          target = next((x for x in candidates if str(x.get("aweme_id") or x.get("item_id") or "") == str(video_id)), None)
                          attempt["candidate_count"] = len(candidates)
                          attempt["candidate_ids"] = [str(x.get("aweme_id") or x.get("item_id") or "") for x in candidates[:12]]
                          if target:
                              attempt["matched"] = True
                              attempt["matched_desc"] = str(target.get("desc") or "")[:500]
                              attempt["matched_author"] = str(((target.get("author") or {}).get("nickname")) or "")[:120]
                              attempt["matched_keys"] = list(target.keys())[:60]
                              report["feed_api_result"] = normalize_item(target, "抖音 App Feed API")
                              report["feed_api_result"]["source"] = endpoint
                              report["feed_api_result"]["response_status"] = response.status_code
                              report["feed_api_result"]["response_top_keys"] = attempt["top_keys"]
                              report["feed_api_result"]["candidate_count"] = len(candidates)
                              report["feed_api_result"]["exact_aweme_id_match"] = True
                              report["detail"] = report["feed_api_result"]
                              report["detail"]["source"] = "抖音 App Feed API"
                              report["feed_api_attempts"].append(attempt)
                              return
                          attempt["error"] = "响应成功，但没有找到 aweme_id 完全匹配的作品"
                      else:
                          attempt["body_preview"] = re.sub(r"\\s+", " ", response.text)[:500]
                  except Exception as exc:
                      attempt["error"] = f"{type(exc).__name__}: {exc}"[:500]
                  report["feed_api_attempts"].append(attempt)

          def safe_url(url):
              try:
                  parsed = urlparse(url)
                  return parsed.scheme + "://" + parsed.netloc + parsed.path
              except Exception:
                  return url[:500]

          def add_video_id(url):
              if not url:
                  return
              match = re.search(r"/(?:share/video|video|note)/(\d+)", url)
              if match and match.group(1) not in report["observed_video_ids"]:
                  report["observed_video_ids"].append(match.group(1))

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1",
                  locale="zh-CN", timezone_id="Asia/Shanghai",
                  viewport={"width": 390, "height": 844},
                  is_mobile=True, has_touch=True
              )
              page = context.new_page()
              page.set_default_timeout(15000)
              page.on("console", lambda msg: report["console_errors"].append(msg.text[:500])
                      if msg.type == "error" and len(report["console_errors"]) < 30 else None)
              page.on("pageerror", lambda exc: report["page_errors"].append(str(exc)[:1000])
                      if len(report["page_errors"]) < 30 else None)

              page.on("request", lambda request: add_video_id(request.url))

              def find_matching_aweme(obj, video_id, path="$", depth=0):
                  """在接口 JSON 中递归寻找与分享链接 ID 完全一致的作品对象。"""
                  if depth > 20:
                      return None
                  if isinstance(obj, dict):
                      item_id = str(obj.get("aweme_id") or obj.get("item_id") or "")
                      if item_id == str(video_id) and ("video" in obj or "author" in obj or "desc" in obj or "statistics" in obj):
                          return obj, path
                      for key, value in obj.items():
                          if isinstance(value, (dict, list)):
                              found = find_matching_aweme(value, video_id, f"{path}.{key}", depth + 1)
                              if found:
                                  return found
                  elif isinstance(obj, list):
                      for i, value in enumerate(obj[:2000]):
                          if isinstance(value, (dict, list)):
                              found = find_matching_aweme(value, video_id, f"{path}[{i}]", depth + 1)
                              if found:
                                  return found
                  return None

              def on_response(response):
                  low = response.url.lower()
                  add_video_id(response.url)
                  location = response.headers.get("location", "")
                  if 300 <= response.status < 400:
                      add_video_id(location)
                      report["redirects"].append({
                          "url": safe_url(response.url),
                          "status": response.status,
                          "location": safe_url(location) if location else ""
                      })
                  content_type = response.headers.get("content-type", "")[:200]
                  # 第二级：监听浏览器实际请求的详情/作品接口，不预设单一接口路径。
                  # 只有响应 JSON 中出现与分享链接完全相同的 aweme_id 才认定为目标作品。
                  if any(k in low for k in ("aweme", "video/detail", "iteminfo", "detail", "share/video")):
                      item = {
                          "url": safe_url(response.url), "status": response.status,
                          "content_type": content_type
                      }
                      try:
                          if "json" in content_type.lower() or "javascript" in content_type.lower():
                              payload = response.json()
                              found = []
                              scan_json(payload, found)
                              item["json_top_keys"] = list(payload.keys())[:50] if isinstance(payload, dict) else []
                              item["json_fields_sample"] = found[:40]
                              if isinstance(payload, dict):
                                  item["json_errno"] = payload.get("errno")
                                  item["json_message"] = str(payload.get("message") or payload.get("msg") or "")[:300]
                              target_id = report.get("video_id")
                              if target_id:
                                  matched = find_matching_aweme(payload, target_id)
                                  if matched:
                                      matched_item, matched_path = matched
                                      normalized = normalize_item(matched_item, "浏览器网络详情接口:" + matched_path)
                                      match_record = {
                                          "url": safe_url(response.url),
                                          "status": response.status,
                                          "matched_aweme_id": target_id,
                                          "matched_path": matched_path,
                                          "desc": str(matched_item.get("desc") or "")[:1000],
                                          "author": str(((matched_item.get("author") or {}).get("nickname")) or "")[:160],
                                          "item_keys": list(matched_item.keys())[:100],
                                          "title_fields": [x for x in found if x.get("path", "").lower().endswith((".title", ".desc", ".description", ".series_name", ".mix_name"))][:60]
                                      }
                                      report["network_detail_matches"].append(match_record)
                                      if (not report.get("detail")) or (not report["detail"].get("desc") and normalized.get("desc")):
                                          report["detail"] = normalized
                                          report["detail"]["source"] = "浏览器网络详情接口"
                      except Exception as exc:
                          item["body_parse_error"] = str(exc)[:300]
                          try:
                              body_text = response.text()
                              item["body_preview"] = re.sub(r"\\s+", " ", body_text)[:1200]
                              if len(report["raw_api_samples"]) < 10:
                                  report["raw_api_samples"].append({
                                      "url": safe_url(response.url),
                                      "status": response.status,
                                      "body_preview": item["body_preview"]
                                  })
                          except Exception:
                              pass
                      report["network_detail_responses"].append(item)

              page.on("response", on_response)
              try:
                  response = page.goto(start_url, wait_until="domcontentloaded", timeout=60000)
                  report["initial_http_status"] = response.status if response else None
                  page.wait_for_timeout(12000)
                  resolved = page.url
                  if not is_douyin(resolved):
                      raise RuntimeError("短链接跳转到了非抖音官方域名，停止访问")
                  report["resolved_url"] = safe_url(resolved)
                  add_video_id(resolved)
                  video_id = report["observed_video_ids"][0] if report["observed_video_ids"] else ""
                  report["video_id"] = video_id

                  # 第一级：抖音 App Feed API。若精确命中目标作品，优先采用其完整详情。
                  if video_id:
                      try_mobile_feed(video_id)

                  # 分享短链可能先经过 iesdouyin.com/share/video/{id}，
                  # 最终却跳到精选首页；因此使用捕获到的中间 URL ID 继续检查。
                  if video_id:
                      share_page_url = f"https://www.iesdouyin.com/share/video/{video_id}/"
                      response = page.goto(share_page_url, wait_until="domcontentloaded", timeout=60000)
                      report["iesdouyin_page"]["http_status"] = response.status if response else None
                      report["iesdouyin_page"]["final_url"] = safe_url(page.url)
                      page.wait_for_timeout(8000)
                      report["iesdouyin_page"]["title"] = page.title()
                      share_text = page.locator("body").inner_text() if page.locator("body").count() else ""
                      report["iesdouyin_page"]["text"] = re.sub(r"\s+", " ", share_text)[:3000]
                      html = page.content()
                      markers = ("_ROUTER_DATA", "SSR_HYDRATED_DATA", "__INITIAL_STATE__", "__NEXT_DATA__", "__UNIVERSAL_DATA_FOR_REHYDRATION__")
                      report["iesdouyin_page"]["data_markers"] = [m for m in markers if m in html]
                      report["iesdouyin_page"]["script_data_candidates"] = page.locator("script").evaluate_all("""els => els.map(e => e.textContent || '').filter(t =>
                        /_ROUTER_DATA|SSR_HYDRATED_DATA|__INITIAL_STATE__|__NEXT_DATA__|__UNIVERSAL_DATA_FOR_REHYDRATION__|aweme_detail|videoInfoRes/i.test(t)
                      ).slice(0,20).map(t => t.slice(0,20000))""")
                      report["iesdouyin_page"]["html_has_video_id"] = video_id in html
                      report["iesdouyin_page"]["html_length"] = len(html)

                      router_data = extract_router_data(html)
                      if router_data is not None:
                          report["iesdouyin_page"]["router_data_keys"] = list(router_data.keys())[:40]
                          found_item = find_video_item(router_data)
                          if found_item:
                              if not report["detail"]:
                                  report["detail"] = normalize_item(found_item[0], found_item[1])
                                  report["detail"]["source"] = "iesdouyin _ROUTER_DATA"
                      for marker in ("验证码", "访问过于频繁", "登录后", "安全验证", "网络异常"):
                          if marker in report["iesdouyin_page"]["text"]:
                              report["blocked_indicators"].append("iesdouyin:" + marker)

                  if not report["detail"]:
                      for fallback_url in (
                          f"https://m.douyin.com/share/video/{video_id}",
                          f"https://www.douyin.com/video/{video_id}"
                      ):
                          attempt = {"url": safe_url(fallback_url)}
                          try:
                              fallback_response = page.goto(fallback_url, wait_until="domcontentloaded", timeout=45000)
                              attempt["http_status"] = fallback_response.status if fallback_response else None
                              page.wait_for_timeout(6000)
                              fallback_html = page.content()
                              fallback_router = extract_router_data(fallback_html)
                              attempt["title"] = page.title()
                              attempt["html_length"] = len(fallback_html)
                              attempt["has_router_data"] = fallback_router is not None
                              if fallback_router is not None:
                                  found_item = find_video_item(fallback_router)
                                  if found_item:
                                      report["detail"] = normalize_item(found_item[0], found_item[1])
                                      report["detail"]["source"] = safe_url(fallback_url) + " _ROUTER_DATA"
                                      attempt["detail_found"] = True
                              attempt["page_text"] = re.sub(r"\\s+", " ", page.locator("body").inner_text())[:1000]
                          except Exception as exc:
                              attempt["error"] = f"{type(exc).__name__}: {exc}"[:500]
                          report["detail_attempts"].append(attempt)
                          if report["detail"]:
                              break

                  page.wait_for_timeout(3000)
                  report["resolved_url"] = safe_url(page.url)
                  report["page_title"] = page.title()
                  body = page.locator("body").inner_text() if page.locator("body").count() else ""
                  report["page_text"] = re.sub(r"\s+", " ", body)[:5000]
                  report["dom_candidates"] = page.evaluate("""() => {
                    const selectors = ['h1','[data-e2e="video-desc"]',
                      '[data-e2e="video-author-nickname"]',
                      '[class*="video-info"] [class*="desc"]','[class*="desc"]'];
                    const out = {};
                    for (const selector of selectors) {
                      out[selector] = [...document.querySelectorAll(selector)].slice(0,8)
                        .map(e => (e.innerText || e.textContent || '').trim())
                        .filter(Boolean).map(s => s.slice(0,1000));
                    }
                    const meta = {};
                    for (const e of document.querySelectorAll('meta')) {
                      const k = e.getAttribute('property') || e.getAttribute('name') || e.getAttribute('itemprop');
                      if (k && e.content) meta[k] = e.content.slice(0,2000);
                    }
                    return {selectors:out,meta};
                  }""")
                  report["meta"] = report["dom_candidates"].pop("meta", {})
                  for marker in ("验证码", "访问过于频繁", "登录后", "安全验证", "网络异常"):
                      if marker in report["page_text"]:
                          report["blocked_indicators"].append("douyin:" + marker)
                  with open("douyin-rendered.html", "w", encoding="utf-8") as f:
                      f.write(page.content()[:10000000])
              except Exception as exc:
                  report["error"] = f"{type(exc).__name__}: {exc}"
                  try:
                      with open("douyin-rendered.html", "w", encoding="utf-8") as f:
                          f.write(page.content()[:10000000])
                  except Exception:
                      pass
              finally:
                  browser.close()

          # 短剧名不能简单等同于作者名或“某某的作品”页面标题。
          # 汇总作品详情、页面标题、Meta、DOM 和路由 JSON 中的标题线索，
          # 并给出保守判定；没有可靠线索时明确标记待识别。
          title_candidates = []
          def add_title_candidate(source, value):
              if not isinstance(value, str):
                  return
              value = re.sub(r"\s+", " ", value).strip(" \t\r\n|·-—")
              if not value or len(value) > 120:
                  return
              if value not in ("抖音", "短视频", "作品", "分享"):
                  title_candidates.append({"source": source, "value": value})

          detail = report.get("detail") or {}
          add_title_candidate("作品文案 desc", detail.get("desc", ""))
          add_title_candidate("页面标题", report.get("page_title", ""))
          add_title_candidate("分享页标题", (report.get("iesdouyin_page") or {}).get("title", ""))
          for key in ("og:title", "twitter:title", "title", "description", "og:description"):
              add_title_candidate("Meta:" + key, report.get("meta", {}).get(key, ""))
          for selector, values in (report.get("dom_candidates") or {}).items():
              for value in values if isinstance(values, list) else []:
                  add_title_candidate("DOM:" + selector, value)
          for response in report.get("network_detail_responses", []):
              for field in response.get("json_fields_sample", []):
                  if field.get("path", "").lower().endswith((".title", ".desc", ".description", ".series_name", ".mix_name")):
                      add_title_candidate("接口JSON:" + field.get("path", ""), field.get("value", ""))
          for matched in report.get("network_detail_matches", []):
              add_title_candidate("网络详情接口作品文案", matched.get("desc", ""))
              for field in matched.get("title_fields", []):
                  add_title_candidate("网络详情接口:" + field.get("path", ""), field.get("value", ""))
          author_name = str(detail.get("author") or "")
          filtered = []
          seen = set()
          for item in title_candidates:
              value = item["value"]
              compact = value.replace(" ", "")
              if author_name and (compact == author_name or compact in (author_name + "的作品", author_name + "的短视频")):
                  continue
              if any(x in compact for x in ("复制打开抖音", "看看【", "的作品", "抖音短视频")):
                  continue
              if compact not in seen:
                  seen.add(compact)
                  filtered.append(item)
          report["title_candidates"] = filtered[:50]
          report["drama_title"] = ""
          report["drama_title_status"] = "待识别"
          if detail.get("desc", "").strip() and not any(x in detail["desc"] for x in ("http://", "https://")):
              report["drama_title"] = detail["desc"].strip()[:120]
              report["drama_title_status"] = "已取得作品文案，尚需确认是否为剧名"
          elif filtered:
              report["drama_title_status"] = "发现标题线索，需人工/后续规则确认"

          print("========== 抖音真实浏览器识别结果 ==========")
          print(json.dumps(report, ensure_ascii=False, indent=2)[:30000])
          with open("douyin-browser-report.json", "w", encoding="utf-8") as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
          with open("douyin-browser-report.md", "w", encoding="utf-8") as f:
              f.write("# 抖音真实浏览器识别报告\n\n")
              f.write(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: 上传识别报告和渲染后网页
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-browser-identification-report
          path: |
            douyin-browser-report.json
            douyin-browser-report.md
            douyin-rendered.html
          if-no-files-found: ignore
          retention-days: 7
