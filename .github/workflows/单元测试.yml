# 核心模块单元测试：接口仓库、签名与解析逻辑
name: 核心模块单元测试

on:
  push:
    branches: [main]
    paths:
      - "kotlin-tv/core/**"
      - "kotlin-tv/app/**"
      - "kotlin-tv/gradle/**"
      - "kotlin-tv/gradlew"
      - "kotlin-tv/gradle.properties"
      - "kotlin-tv/settings.gradle.kts"
      - "kotlin-tv/build.gradle.kts"
      - ".github/workflows/单元测试.yml"
  pull_request:
    paths:
      - "kotlin-tv/core/**"
      - "kotlin-tv/gradle/**"
      - "kotlin-tv/gradlew"
      - "kotlin-tv/gradle.properties"
      - "kotlin-tv/settings.gradle.kts"
      - "kotlin-tv/build.gradle.kts"
      - ".github/workflows/单元测试.yml"

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: 核心模块测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
      - name: 配置Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: kotlin-tv/**/*.gradle*
      - name: 配置Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: 运行核心模块单元测试
        working-directory: kotlin-tv
        run: |
          ./gradlew --no-daemon :core:test
          ./gradlew --no-daemon :app:compileDebugKotlin
