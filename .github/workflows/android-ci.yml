name: HHTV Android CI

on:
  push:
    branches:
      - refactor
    paths:
      - 'kotlin-tv/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'kotlin-tv/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # push 与同仓库 PR 使用相同的来源分支键，避免同一提交重复跑两套 CI。
  # 加入来源仓库名，避免不同 fork 的同名分支互相取消。
  group: hhtv-android-ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: 核心测试与 Android APK 编译
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 检出 HHTV
        uses: actions/checkout@v4
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 配置 Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: 安装 Android 36 编译组件
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: 运行核心与应用单元测试
        run: ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:testDebugUnitTest --no-daemon --stacktrace
      - name: 编译 Debug APK
        run: ./kotlin-tv/gradlew -p kotlin-tv :app:assembleDebug --no-daemon --stacktrace
      - name: 检查 APK 包名
        shell: bash
        run: |
          set -euo pipefail
          APK="kotlin-tv/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          test "$PACKAGE" = "com.x.hongguotv"
          echo "APK 编译及包名检查通过：$PACKAGE"
