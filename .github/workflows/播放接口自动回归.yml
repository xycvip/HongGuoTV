name: 播放接口自动回归

on:
  push:
    branches: [main]
    paths:
      - "kotlin-tv/**"
      - ".github/workflows/播放接口自动回归.yml"
  pull_request:
    branches: [main]
    paths:
      - "kotlin-tv/**"
      - ".github/workflows/播放接口自动回归.yml"

permissions:
  contents: read

concurrency:
  group: playback-api-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: 单元测试与 Debug 构建
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: kotlin-tv/**/*.gradle*

      - name: 检查 Android SDK 并安装所需平台
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort -V | tail -n 1)"
          fi
          if [[ -z "${SDKMANAGER:-}" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::找不到 Android SDK 命令行工具 sdkmanager"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36"

      - name: 运行单元测试并构建 Debug APK
        working-directory: kotlin-tv
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
