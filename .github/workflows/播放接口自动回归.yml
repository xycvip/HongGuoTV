name: 播放接口自动回归

on:
  push:
    branches: [main]
    paths:
      - "kotlin-tv/**"
      - ".github/workflows/播放接口自动回归.yml"
  pull_request:
    branches: [main]
    paths:
      - "kotlin-tv/**"
      - ".github/workflows/播放接口自动回归.yml"

permissions:
  contents: read

concurrency:
  group: playback-api-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: 单元测试与 Debug 构建
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: kotlin-tv/**/*.gradle*

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android 36 平台
        run: sdkmanager "platforms;android-36"

      - name: 运行单元测试并构建 Debug APK
        working-directory: kotlin-tv
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
