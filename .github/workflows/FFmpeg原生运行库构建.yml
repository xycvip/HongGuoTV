name: FFmpeg原生运行库构建

on:
  push:
    branches:
      - feature/ffmpeg-soft-decode
    paths:
      - "kotlin-tv/ffmpeg/**"
      - "kotlin-tv/ffmpeg-runtime/**"
      - "kotlin-tv/app/src/main/cpp/**"
      - "kotlin-tv/build.gradle.kts"
      - "kotlin-tv/settings.gradle.kts"
      - ".github/workflows/FFmpeg原生运行库构建.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ffmpeg-native-build-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: 构建四种 Android ABI 原生库
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 配置 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: kotlin-tv/**/*.gradle*

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 安装 NDK、CMake 和构建工具
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y nasm pkg-config meson ninja-build

      - name: 编译 FFmpeg 依赖及四种 ABI
        working-directory: kotlin-tv
        env:
          ANDROID_ABIS: "x86 x86_64 armeabi-v7a arm64-v8a"
          ANDROID_NDK_VERSION: "25.2.9519653"
          ANDROID_CMAKE_VERSION: "3.22.1"
        run: |
          sed -i 's/^JOBS=.*/JOBS=2/' ffmpeg/setup.sh
          bash ffmpeg/setup.sh

      - name: 编译 JNI 桥接库并打包 AAR
        working-directory: kotlin-tv
        run: ./gradlew --no-daemon :ffmpeg-runtime:assembleRelease

      - name: 按 ABI 拆分运行库并生成校验值
        working-directory: kotlin-tv
        run: |
          mkdir -p runtime-dist/aar
          unzip -q ffmpeg-runtime/build/outputs/aar/ffmpeg-runtime-release.aar -d runtime-dist/aar
          required_libs="libavutil.so libswresample.so libswscale.so libavcodec.so libmedia3ext.so"
          for abi in x86 x86_64 armeabi-v7a arm64-v8a; do
            mkdir -p "runtime-dist/$abi"
            for lib in $required_libs; do
              cp "runtime-dist/aar/jni/$abi/$lib" "runtime-dist/$abi/$lib"
            done
            (cd "runtime-dist/$abi" && sha256sum $required_libs > SHA256SUMS)
            (cd runtime-dist && zip -qr "HongGuoTV-FFmpeg-$abi.zip" "$abi")
          done

      - name: 生成正式清单和独立下载文件
        working-directory: kotlin-tv
        env:
          RUNTIME_VERSION: "0.1.0-\${{ github.run_number }}"
          RUNTIME_RELEASE_TAG: "ffmpeg-runtime-latest"
          GITHUB_REPOSITORY: \${{ github.repository }}
        run: |
          mkdir -p runtime-dist/release-assets
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          abis = ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
          libraries = [
              ("libavutil.so", 1),
              ("libswresample.so", 2),
              ("libswscale.so", 3),
              ("libavcodec.so", 4),
              ("libmedia3ext.so", 5),
          ]
          version = os.environ["RUNTIME_VERSION"]
          tag = os.environ["RUNTIME_RELEASE_TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          manifest = {"version": version, "abis": {}}
          assets = Path("runtime-dist/release-assets")
          for abi in abis:
              entries = []
              for filename, order in libraries:
                  source = Path("runtime-dist") / abi / filename
                  if not source.is_file():
                      raise SystemExit(f"缺少原生库：{source}")
                  asset_name = f"{abi}-{filename}"
                  shutil.copy2(source, assets / asset_name)
                  entries.append({
                      "file": filename,
                      "url": f"{base}/{asset_name}",
                      "sha256": hashlib.sha256(source.read_bytes()).hexdigest(),
                      "loadOrder": order,
                  })
              manifest["abis"][abi] = {"libraries": entries}
          (assets / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (assets / "README.txt").write_text(
              "HongGuoTV FFmpeg 独立运行库\n"
              f"版本：{version}\n"
              "安装清单：manifest.json\n"
              "App 会自动识别当前进程 ABI，只下载对应架构的五个原生库。\n"
              "每个文件均由 App 校验 SHA-256 和 ELF 架构。\n",
              encoding="utf-8",
          )
          PY
          cp runtime-dist/HongGuoTV-FFmpeg-*.zip runtime-dist/release-assets/

      - name: 上传 Actions 备份产物
        uses: actions/upload-artifact@v6
        with:
          name: HongGuoTV-FFmpeg-Native-Runtimes
          path: |
            kotlin-tv/ffmpeg-runtime/build/outputs/aar/ffmpeg-runtime-release.aar
            kotlin-tv/runtime-dist/release-assets/*
            kotlin-tv/runtime-dist/*/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: 发布独立 FFmpeg 运行库（稳定下载地址）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ffmpeg-runtime-latest
          name: HongGuoTV FFmpeg 独立运行库
          body: |
            此 Release 仅用于播放器 FFmpeg 扩展运行库，不包含 APK，不参与正式版/测试版应用发布。
            App 使用固定清单地址自动识别 ABI，并只下载当前进程所需的原生库。
            每次成功构建会覆盖本 Release 的运行库文件，SHA-256 以 manifest.json 为准。
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            kotlin-tv/runtime-dist/release-assets/*
