name: FFmpeg原生运行库构建

on:
  push:
    branches:
      - feature/ffmpeg-soft-decode
    paths:
      - "kotlin-tv/ffmpeg/**"
      - "kotlin-tv/ffmpeg-runtime/**"
      - "kotlin-tv/app/src/main/cpp/**"
      - "kotlin-tv/build.gradle.kts"
      - "kotlin-tv/settings.gradle.kts"
      - ".github/workflows/FFmpeg原生运行库构建.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffmpeg-native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: 构建四种 Android ABI 原生库
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 配置 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: kotlin-tv/**/*.gradle*

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 安装 NDK、CMake 和构建工具
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y nasm pkg-config meson ninja-build

      - name: 编译 FFmpeg 依赖及四种 ABI
        working-directory: kotlin-tv
        env:
          ANDROID_ABIS: "x86 x86_64 armeabi-v7a arm64-v8a"
          ANDROID_NDK_VERSION: "25.2.9519653"
          ANDROID_CMAKE_VERSION: "3.22.1"
        run: |
          sed -i 's/^JOBS=.*/JOBS=2/' ffmpeg/setup.sh
          bash ffmpeg/setup.sh

      - name: 编译 JNI 桥接库并打包 AAR
        working-directory: kotlin-tv
        run: ./gradlew --no-daemon :ffmpeg-runtime:assembleRelease

      - name: 按 ABI 拆分运行库并生成校验值
        working-directory: kotlin-tv
        run: |
          mkdir -p runtime-dist/aar
          unzip -q ffmpeg-runtime/build/outputs/aar/ffmpeg-runtime-release.aar -d runtime-dist/aar
          required_libs="libavutil.so libswresample.so libswscale.so libavcodec.so libmedia3ext.so"
          for abi in x86 x86_64 armeabi-v7a arm64-v8a; do
            mkdir -p "runtime-dist/$abi"
            for lib in $required_libs; do
              cp "runtime-dist/aar/jni/$abi/$lib" "runtime-dist/$abi/$lib"
            done
            (cd "runtime-dist/$abi" && sha256sum $required_libs > SHA256SUMS)
            (cd runtime-dist && zip -qr "HongGuoTV-FFmpeg-$abi.zip" "$abi")
          done

      - name: 生成通用 ABI 清单模板
        working-directory: kotlin-tv
        env:
          RUNTIME_VERSION: "0.1.0-${{ github.run_number }}"
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          abis = ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
          libraries = [
              ("libavutil.so", 1),
              ("libswresample.so", 2),
              ("libswscale.so", 3),
              ("libavcodec.so", 4),
              ("libmedia3ext.so", 5),
          ]
          manifest = {"version": os.environ["RUNTIME_VERSION"], "abis": {}}
          for abi in abis:
              entries = []
              for filename, order in libraries:
                  path = Path("runtime-dist") / abi / filename
                  if not path.is_file():
                      raise SystemExit(f"缺少原生库：{path}")
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  entries.append({
                      "file": filename,
                      "url": f"https://YOUR_HTTPS_HOST/ffmpeg-runtime/{abi}/{filename}",
                      "sha256": digest,
                      "loadOrder": order,
                  })
              manifest["abis"][abi] = {"libraries": entries}
          Path("runtime-dist/manifest-template.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: 上传原生运行库和 ABI 压缩包
        uses: actions/upload-artifact@v6
        with:
          name: HongGuoTV-FFmpeg-Native-Runtimes
          path: |
            kotlin-tv/ffmpeg-runtime/build/outputs/aar/ffmpeg-runtime-release.aar
            kotlin-tv/runtime-dist/HongGuoTV-FFmpeg-*.zip
            kotlin-tv/runtime-dist/*/SHA256SUMS
            kotlin-tv/runtime-dist/manifest-template.json
          if-no-files-found: error
          retention-days: 14
