name: Phoenix Resource Filter Check

on:
  push:
    branches:
      - main
    paths:
      - "kotlin-tv/playback-phoenix/**"
      - "kotlin-tv/app/**"
      - ".github/workflows/phoenix-resource-filter-check.yml"
  workflow_dispatch:
    inputs:
      run_app_regression:
        description: "Run application regression tests as well"
        required: true
        type: boolean
        default: true
      phoenix_video_id:
        description: "Real Phoenix episode/video ID (defaults to the episode from the supplied 2026-11-08 diagnostic log)"
        required: false
        type: string
        default: "7703473857260162073"

permissions:
  contents: read

concurrency:
  group: phoenix-resource-filter-check
  cancel-in-progress: false

jobs:
  phoenix-check:
    name: Phoenix resource parsing and filtering regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify Phoenix module and test files
        shell: bash
        run: |
          set -euo pipefail
          test -s kotlin-tv/playback-phoenix/src/main/kotlin/com/hongguotv/core/PhoenixMediaResolver.kt
          test -s kotlin-tv/playback-phoenix/src/main/kotlin/com/hongguotv/core/PhoenixPlaybackSource.kt
          test -s kotlin-tv/playback-phoenix/src/test/kotlin/com/hongguotv/core/PhoenixPlaybackSourceTest.kt
          test -s kotlin-tv/playback-phoenix/src/test/kotlin/com/hongguotv/core/PhoenixLiveResourceDiagnosticTest.kt
          echo "Phoenix resolver, playback source, unit tests, and live diagnostic entry exist."

      - name: Run Phoenix resource parsing unit tests
        working-directory: kotlin-tv
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :playback-phoenix:test

      - name: Run live Phoenix API resource diagnosis
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.phoenix_video_id != '' }}
        working-directory: kotlin-tv
        env:
          PHOENIX_VIDEO_ID: ${{ inputs.phoenix_video_id }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --rerun-tasks --stacktrace :playback-phoenix:test --tests "com.hongguotv.core.PhoenixLiveResourceDiagnosticTest"

      - name: Run application regression tests
        if: ${{ inputs.run_app_regression }}
        working-directory: kotlin-tv
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:compileDebugKotlin

      - name: Publish diagnostic baseline
        if: always()
        shell: bash
        run: |
          {
            echo "## Phoenix resource-filter diagnostic baseline"
            echo ""
            echo "- Log version: HongGuoTV 1.1.38"
            echo "- Phoenix response: HTTP 200; body approximately 16 KB (second log: 16,211 bytes)"
            echo "- Observed result: 5 candidate resources rejected as incompatible codecs"
            echo "- Encryption rejection count: 0"
            echo "- Inspect codec_type, definition/vheight, URL fields, and each rejection reason."
            echo ""
            echo "> Manual dispatch with phoenix_video_id runs the real device-registration, signed video_model/v1 request, fallback_api resolution, and production resource filter. Without that input, only offline regression tests run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Phoenix unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-resource-filter-test-reports
          path: kotlin-tv/playback-phoenix/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload application regression reports
        if: always() && inputs.run_app_regression
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-app-regression-test-reports
          path: kotlin-tv/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14


