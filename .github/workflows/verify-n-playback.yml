name: 临时验证 Native N 接口对齐
on:
  pull_request:
    branches:
      - main
    paths:
      - "kotlin-tv/playback-native/**"
      - "kotlin-tv/playback-media/**"
      - "kotlin-tv/core/src/main/kotlin/com/hongguotv/core/ContentRepository.kt"
      - "kotlin-tv/app/**"
permissions:
  contents: read
concurrency:
  group: verify-native-n-playback
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
      - name: 配置 Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: 运行 Native 与核心单元测试并构建 Debug APK
        working-directory: kotlin-tv
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :playback-native:test :core:test :app:assembleDebug
