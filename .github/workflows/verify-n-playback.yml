name: 临时验证 Native N 接口对齐
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: verify-native-n-playback
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
      - name: 配置 Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: 运行 Native、Phoenix 回归测试及 Debug 构建
        working-directory: kotlin-tv
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :playback-native:test :playback-phoenix:test :core:test :app:assembleDebug
