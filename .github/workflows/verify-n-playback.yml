name: 临时验证 Native N 接口对齐
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: verify-native-n-playback-final
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
      - name: 验证 THL 官方签名算法
        run: node kotlin-tv/scripts/verify-thl-signing.cjs
      - name: 配置 Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: 运行 N 接口定向回归测试
        working-directory: kotlin-tv
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :playback-native:test :core:test \
            --tests 'com.hongguotv.core.ContentRepositoryTest.nativePlaybackUsesTHLRegisteredProfileAndMultiVideoModelEndpoint' \
            --tests 'com.hongguotv.core.ThlDeviceRegisterTest.*' \
            --tests 'com.hongguotv.core.PlaybackDeviceSessionTest.*' \
            --tests 'com.hongguotv.core.MobilePlaybackTest.*' \
            --tests 'com.hongguotv.core.ContentRepositoryTest.compatibilityModeChoosesHighestResolutionH264' \
            --tests 'com.hongguotv.core.ContentRepositoryTest.manualQualityChoosesHighestAvailableResolutionAtOrBelowLimit' \
            --tests 'com.hongguotv.core.ContentRepositoryTest.incompatibleByteVc2DoesNotBecomeAudioOnlyPlayback' \
            --tests 'com.hongguotv.core.ContentRepositoryTest.compatibleLowerQualityWinsBeforeHigherResolutionFallback' \
            --tests 'com.hongguotv.core.ContentRepositoryTest.missingCodecLabelKeepsManualQualityLimit'
      - name: 构建 Android Debug APK
        working-directory: kotlin-tv
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
