name: 临时验证 Native N 接口对齐
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: verify-native-n-playback-final
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
      - name: 配置 Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: 运行 N 接口定向回归测试
        working-directory: kotlin-tv
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :playback-native:test :core:test --tests 'com.hongguotv.core.ContentRepositoryTest' --tests 'com.hongguotv.core.SignerTest'
      - name: 构建 Android Debug APK
        working-directory: kotlin-tv
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
