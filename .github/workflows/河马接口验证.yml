name: 河马接口验证

on:
  workflow_dispatch:
    inputs:
      book_id:
        description: "可选：短剧 bookId；留空只验证设备注册"
        required: false
        type: string
      chapter_id:
        description: "可选：分集 chapterId；填写后验证 1132/1133"
        required: false
        type: string
      test_playback_url:
        description: "是否对解析出的播放地址进行 Range 1 字节连通性检查"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: hema-api-verification
  cancel-in-progress: false

jobs:
  verify:
    name: 设备注册、目录、播放解析验证
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 安装验证依赖
        run: python -m pip install --disable-pip-version-check pycryptodome

      - name: 执行接口验证
        env:
          BOOK_ID: ${{ inputs.book_id }}
          CHAPTER_ID: ${{ inputs.chapter_id }}
          TEST_PLAYBACK_URL: ${{ inputs.test_playback_url }}
        run: |
          python <<'PY'
          import os, json, time, uuid
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from urllib.parse import urlsplit, urlunsplit
          from Crypto.Cipher import AES
          from Crypto.Util.Padding import pad, unpad

          DOMAINS = ["freevideo.zqqds.cn", "freevideo.dzkjk.cn"]
          KEY, IV = b"dzkjgfyxgshylgzm", b"apiupdownedcrypt"
          BOOK, CHAPTER = os.getenv("BOOK_ID","").strip(), os.getenv("CHAPTER_ID","").strip()
          TEST_URL = os.getenv("TEST_PLAYBACK_URL","true").lower() == "true"
          DEVICE = uuid.uuid4().hex
          INSTALL = int(time.time()*1000)
          TEMP_ID = "A" + datetime.now().strftime("%Y%m%d%H%M%S%f")[:17] + uuid.uuid4().hex[:6]
          USER_ID = ""
          REPORT = {"started_at":datetime.now(timezone.utc).isoformat(),"checks":[]}

          def enc(s):
              return AES.new(KEY,AES.MODE_CBC,IV).encrypt(pad(s.encode(),16)).hex()
          def dec(s):
              return unpad(AES.new(KEY,AES.MODE_CBC,IV).decrypt(bytes.fromhex(s)),16).decode()
          def headers():
              return {"version":"1.4.0","pname":"com.dz.hmjc","channelCode":"Google",
                "utdidTmp":TEMP_ID,"token":"","utdid":DEVICE,"os":"android","osv":"GitHub Actions",
                "brand":"Android","model":"GitHubActions","manu":"Android","userId":USER_ID,
                "launch":"shortcut","mchid":"Google","nchid":"Google","session1":DEVICE,
                "session2":str(int(time.time()*1000)),"oaid":"","imei":"","startScene":"shortcut",
                "installTime":INSTALL,"p":9}
          def decode_response(raw, encrypted):
              obj=json.loads(raw or "{}")
              if not isinstance(obj,dict): raise ValueError("响应不是 JSON 对象")
              code=obj.get("code")
              if code is not None and str(code) not in ("0","200"):
                  raise RuntimeError(f"业务 code={code}, msg={str(obj.get('msg',''))[:120]}")
              data=obj.get("data",obj)
              if isinstance(data,str) and data:
                  data=json.loads(dec(data) if encrypted else data)
              return data if isinstance(data,dict) else obj
          def request_api(api, params):
              errors=[]
              for domain in DOMAINS:
                  for encrypted in (False,True):
                      hjson=json.dumps(headers(),separators=(",",":"),ensure_ascii=False)
                      pjson=json.dumps(params,separators=(",",":"),ensure_ascii=False)
                      hs={"Content-Type":"application/json","Accept":"application/json",
                          "datas":enc(hjson) if encrypted else hjson}
                      if not encrypted: hs["wetruwtty"]="mhdfiheowjfcslkjfwojo636"
                      body=(enc(pjson) if encrypted else pjson).encode()
                      req=Request(f"https://{domain}/free-video-portal/portal/{api}",data=body,headers=hs,method="POST")
                      start=time.time()
                      try:
                          with urlopen(req,timeout=18) as resp:
                              raw=resp.read(5*1024*1024).decode("utf-8","replace")
                              data=decode_response(raw,encrypted)
                              meta={"api":api,"domain":domain,"transport":"AES" if encrypted else "JSON",
                                    "http":resp.status,"elapsed_ms":int((time.time()-start)*1000)}
                              REPORT["checks"].append(meta)
                              return data,meta
                      except HTTPError as e:
                          errors.append(f"{domain}/{('AES' if encrypted else 'JSON')}: HTTP {e.code}")
                      except Exception as e:
                          errors.append(f"{domain}/{('AES' if encrypted else 'JSON')}: {type(e).__name__}: {str(e)[:120]}")
              REPORT["checks"].append({"api":api,"status":"FAILED","errors":errors})
              raise RuntimeError(f"接口 {api} 在两个域名、两种传输模式下均失败")
          def find_list(obj,key,depth=0):
              if depth>8:return []
              if isinstance(obj,dict):
                  if isinstance(obj.get(key),list):return [x for x in obj[key] if isinstance(x,dict)]
                  for v in obj.values():
                      r=find_list(v,key,depth+1)
                      if r:return r
              if isinstance(obj,list):
                  for v in obj:
                      r=find_list(v,key,depth+1)
                      if r:return r
              return []
          def find_urls(obj):
              keys={"m3u81080pUrl","m3u81080p","mp41080pUrl","mp41080p","m3u8720pUrl",
                    "m3u8720p","mp4720pUrl","mp4720p","mp4","m3u8","url",
                    "m3u81080pSwitchUrl","mp41080pSwitchUrl","m3u8720pSwitchUrl","mp4720pSwitchUrl"}
              out=[]
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      if k in keys:
                          if isinstance(v,str) and v.startswith(("http://","https://")):out.append(v)
                          if isinstance(v,list):out.extend(x for x in v if isinstance(x,str) and x.startswith(("http://","https://")))
                      else:out.extend(find_urls(v))
              elif isinstance(obj,list):
                  for v in obj:out.extend(find_urls(v))
              return list(dict.fromkeys(out))
          def redacted(url):
              p=urlsplit(url)
              return urlunsplit((p.scheme,p.netloc,p.path,"[已隐藏] " if p.query else "",""))
          def probe(url):
              req=Request(url,headers={"Range":"bytes=0-0","User-Agent":"Mozilla/5.0"},method="GET")
              try:
                  with urlopen(req,timeout=15) as r:
                      sample=r.read(1)
                      return {"status":"可访问","http":r.status,"content_type":r.headers.get("Content-Type",""),
                              "range_206":r.status==206,"sample_bytes":len(sample)}
              except HTTPError as e:return {"status":"HTTP错误","http":e.code}
              except Exception as e:return {"status":"网络错误","error":f"{type(e).__name__}: {str(e)[:120]}"}

          print("河马剧场 API 验证开始；使用临时虚拟设备标识，不使用真实 IMEI/OAID。")
          try:
              init,meta=request_api("1103",{"oaid":"","userAgent":"GitHubActions/Python","requestType":1,
                "activeType":1,"isFirstLaunch":True,"todayLaunchNums":1,"launchTime":INSTALL})
              user=init.get("userInfoVo") if isinstance(init.get("userInfoVo"),dict) else {}
              USER_ID=str(user.get("userId") or init.get("userId") or "")
              meta["user_id_returned"]=bool(USER_ID)
              print(f"[通过] 1103 设备初始化：{meta['domain']} / {meta['transport']}；userId 返回={bool(USER_ID)}")

              if BOOK:
                  detail,meta=request_api("1132",{"bookId":BOOK,"chapterMin":0,"chapterMax":100})
                  chapters=find_list(detail,"chapterList")
                  meta["chapter_count"]=len(chapters)
                  print(f"[通过] 1132 目录接口：{len(chapters)} 集")
                  if CHAPTER:
                      data,meta=request_api("1133",{"bookId":BOOK,"chapterId":CHAPTER,
                        "unClockType":"pay","confirmPay":1,"autoPayFlag":False})
                      rows=find_list(data,"chapterInfo")
                      urls=find_urls(rows if rows else data)
                      meta["chapter_info_count"]=len(rows)
                      meta["playback_url_count"]=len(urls)
                      meta["playback_urls_redacted"]=[redacted(x) for x in urls[:8]]
                      print(f"[通过] 1133 播放解析：chapterInfo={len(rows)}，URL={len(urls)}")
                      if not urls: raise RuntimeError("1133 请求成功，但响应未识别到播放 URL")
                      if TEST_URL:
                          checks=[probe(u) for u in urls[:4]]
                          meta["url_probes"]=checks
                          for i,c in enumerate(checks,1):print(f"[播放地址 {i}] {c}")
                          if not any(c.get("status")=="可访问" for c in checks):
                              raise RuntimeError("1133 返回了 URL，但抽样地址均无法访问")
                  else: print("[跳过] 未填写 chapter_id，未调用 1133")
              else: print("[跳过] 未填写 book_id，未调用 1132/1133")
              REPORT["result"]="SUCCESS"
          except Exception as e:
              REPORT["result"]="FAILED"
              REPORT["error"]=f"{type(e).__name__}: {str(e)[:240]}"
              print("::error::"+REPORT["error"])
              raise
          finally:
              REPORT["finished_at"]=datetime.now(timezone.utc).isoformat()
              out=os.path.join(os.getenv("RUNNER_TEMP","."),"hema-api-report.json")
              with open(out,"w",encoding="utf-8") as f:json.dump(REPORT,f,ensure_ascii=False,indent=2)
              rows=["## 河马接口验证结果","",f"- 结果：**{REPORT.get('result','FAILED')}**",
                    f"- bookId：{'已提供' if BOOK else '未提供'}",
                    f"- chapterId：{'已提供' if CHAPTER else '未提供'}","",
                    "| 接口 | 域名 | 传输 | HTTP | 耗时 |","|---|---|---|---:|---:|"]
              for x in REPORT["checks"]:
                  rows.append(f"| {x.get('api','-')} | {x.get('domain','-')} | {x.get('transport','-')} | {x.get('http','-')} | {x.get('elapsed_ms','-')} ms |")
              if REPORT.get("error"):rows+=["",f"错误：{REPORT['error']}"]
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:f.write("\n".join(rows)+"\n")
              print("报告已脱敏；播放 URL 的查询参数不会写入日志。")
          PY

      - name: 上传脱敏报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hema-api-verification-report
          path: ${{ runner.temp }}/hema-api-report.json
          if-no-files-found: ignore
          retention-days: 14
