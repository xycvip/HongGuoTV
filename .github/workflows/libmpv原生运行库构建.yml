name: libmpv 原生运行库构建

on:
  push:
    branches:
      - libmpv-hongguotv
    paths:
      - "kotlin-tv/libmpv-runtime/**"
      - "kotlin-tv/app/**"
      - "kotlin-tv/settings.gradle.kts"
      - "kotlin-tv/build.gradle.kts"
      - ".github/workflows/libmpv原生运行库构建.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libmpv-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 libmpv（ARM 32/64 位）并编译红果TV
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: 检出红果TV
        uses: actions/checkout@v7

      - name: 检出 mpv-android 原生构建脚本
        uses: actions/checkout@v7
        with:
          repository: mpv-android/mpv-android
          ref: 255901dd586fa750000fa0075f69d6ffdd26cd9c
          path: mpv-android

      - name: 配置 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            kotlin-tv/**/*.gradle*
            mpv-android/**/*.gradle*

      - name: 安装 mpv 原生构建依赖
        working-directory: mpv-android
        run: |
          chmod +x buildscripts/download.sh buildscripts/buildall.sh
          sudo apt-get update
          sudo apt-get install -y autoconf pkg-config libtool ninja-build unzip wget meson gperf nasm
          (cd buildscripts && IN_CI=1 ./download.sh)

      - name: 将上游 JNI 符号适配为 HongGuoTV LibMpvNativeBridge
        working-directory: mpv-android
        run: |
          sed -i 's/Java_is_xyz_mpv_MPVLib_/Java_com_x_hongguotv_libmpv_LibMpvNativeBridge_/g' app/src/main/jni/jni_utils.h
          sed -i 's#is/xyz/mpv/MPVLib#com/x/hongguotv/libmpv/LibMpvNativeBridge#g' app/src/main/jni/jni_utils.cpp
          sed -i 's/mpv_MPVLib/mpv_LibMpvNativeBridge/g' app/src/main/jni/*.h app/src/main/jni/*.cpp

      - name: 构建 ARM 32 位 libmpv
        working-directory: mpv-android
        run: ./buildscripts/buildall.sh --arch armv7l mpv

      - name: 构建 ARM 64 位 libmpv
        working-directory: mpv-android
        run: ./buildscripts/buildall.sh --arch arm64 mpv

      - name: 构建上游 JNI 桥接库
        working-directory: mpv-android
        run: ./buildscripts/buildall.sh --arch arm64 -n mpv-android

      - name: 提取 libmpv 及其依赖库
        shell: bash
        run: |
          set -euo pipefail
          apk="mpv-android/app/build/outputs/apk/default/debug/app-default-universal-debug.apk"
          test -f "$apk"
          for abi in armeabi-v7a arm64-v8a; do
            destination="kotlin-tv/libmpv-runtime/src/main/jniLibs/$abi"
            mkdir -p "$destination"
            unzip -Z1 "$apk" | grep "^lib/$abi/.*\.so$" | while read -r entry; do
              unzip -p "$apk" "$entry" > "$destination/$(basename "$entry")"
            done
            test -s "$destination/libmpv.so"
            test -s "$destination/libplayer.so"
            test -s "$destination/libavcodec.so"
            echo "ABI=$abi"
            file "$destination"/*.so
          done

      - name: 编译红果TV libmpv 实验版
        working-directory: kotlin-tv
        run: |
          ./gradlew --no-daemon :libmpv-runtime:assembleDebug :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: 上传实验 APK 和原生库
        uses: actions/upload-artifact@v6
        with:
          name: HongGuoTV-libmpv-Debug
          path: |
            kotlin-tv/app/build/outputs/apk/debug/app-debug.apk
            kotlin-tv/libmpv-runtime/src/main/jniLibs/armeabi-v7a/*.so
            kotlin-tv/libmpv-runtime/src/main/jniLibs/arm64-v8a/*.so
          if-no-files-found: error
          retention-days: 14
