name: 详情接口精确匹配检测

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hongguotv-detail-probe
  cancel-in-progress: false

jobs:
  detail-probe:
    name: 横向检测多仓库详情接口（特殊剧 + 正常剧对照）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 配置 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 检测搜索与详情接口
        working-directory: kotlin-tv
        shell: bash
        run: |
          set -uo pipefail
          chmod +x ./gradlew
          mkdir -p "$RUNNER_TEMP/detail-probe"
          set +e
          ./gradlew --no-daemon --stacktrace :core:run --args="--detail-probe --keyword 永昼赴星光 --control-id 7615470177953532990" 2>&1 | tee "$RUNNER_TEMP/detail-probe/report.txt"
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "gradle_exit_code=$STATUS" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "## 红果详情接口横向兼容性检测"
            echo
            echo "- 目标片名：永昼赴星光"
            echo "- 匹配规则：标题必须逐字完全一致，不接受相似标题"
            echo "- 特殊剧：永昼赴星光（先从搜索结果中逐字匹配真实 series_id）"
            echo "- 正常剧对照 ID：7615470177953532990"
            echo "- 检测接口：Phoenix 单剧详情、普通批量详情、预加载详情、播放器场景详情、dynamic_data/detail 场景、官网 /detail 与 /player 页面"
            echo "- 成功标准：真实标题/详情字段或有效分集数据；HTTP 200 空响应不算成功"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/detail-probe/report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/detail-probe/report.txt" detail-probe-report.txt
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::详情接口探测程序执行失败，具体信息见报告"
            exit "$STATUS"
          fi

      - name: 上传检测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 红果详情接口横向兼容性检测报告
          path: |
            kotlin-tv/detail-probe-report.txt
            ${{ runner.temp }}/detail-probe/report.txt
          if-no-files-found: warn
          retention-days: 14
